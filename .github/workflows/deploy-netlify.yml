name: Deploy to Netlify

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20" # or '20'

      - name: Install dependencies
        run: npm install

      - name: Verify environment variables
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then 
            echo "ERROR: NEXT_PUBLIC_SUPABASE_URL is not set"
            exit 1
          else 
            echo "✓ NEXT_PUBLIC_SUPABASE_URL is set"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then 
            echo "ERROR: NEXT_PUBLIC_SUPABASE_ANON_KEY is not set"
            exit 1
          else 
            echo "✓ NEXT_PUBLIC_SUPABASE_ANON_KEY is set"
          fi

      - name: Build the project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          IS_NETLIFY: true
        run: npm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=out --auth=$NETLIFY_AUTH_TOKEN --site=82d6f505-6006-4230-a788-f6751a1f70b3
